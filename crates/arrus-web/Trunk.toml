[build]
target = "index.html"
dist = "dist"
public_url = "/"

# `trunk serve` on :8000 forwards the API and the server's login pages to a
# locally running arrus-server.
[serve]
addresses = ["127.0.0.1"]
port = 8000

[[proxy]]
backend = "http://127.0.0.1:8080/api"

[[proxy]]
backend = "http://127.0.0.1:8080/login"

[[proxy]]
backend = "http://127.0.0.1:8080/logout"
