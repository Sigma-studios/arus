<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Eightcount</title>
    <!-- "Add to Home Screen" opens Eightcount as an app, without browser bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Eightcount" />
    <link data-trunk rel="copy-file" href="static/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="static/icon-180.png" />
    <link data-trunk rel="copy-file" href="static/icon-192.png" />
    <link data-trunk rel="copy-file" href="static/icon-512.png" />
    <link data-trunk rel="copy-file" href="static/favicon.ico" />
    <link data-trunk rel="copy-file" href="static/favicon-32.png" />
    <link data-trunk rel="rust" data-bin="arrus-web" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b0c;
        color: #a0a0a8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #arus_canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 15px;
        pointer-events: none;
      }
      #loading b {
        color: #9266f8;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas id="arus_canvas"></canvas>
    <div id="loading"><b>Eightcount</b><span>Loading…</span></div>
  </body>
</html>
