<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E1015" />
    <title>arus</title>
    <!-- "Add to Home Screen" opens arus as an app, without browser bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="arus" />
    <link data-trunk rel="copy-file" href="static/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="static/icon-180.png" />
    <link data-trunk rel="copy-file" href="static/icon-512.png" />
    <link data-trunk rel="rust" data-bin="arrus-web" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1015;
        color: #959eb0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /* Stay inside the phone's safe area: off the notch and above the iPhone
         home bar, whose swipes switch apps. Zero on computers. */
      #arus_canvas {
        position: absolute;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        width: auto;
        height: auto;
        display: block;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 15px;
        pointer-events: none;
      }
      #loading b {
        color: #f03e74;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas id="arus_canvas"></canvas>
    <div id="loading"><b>arus</b><span>Loading…</span></div>
  </body>
</html>
