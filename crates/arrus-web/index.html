<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E1015" />
    <title>arus</title>
    <link data-trunk rel="rust" data-bin="arrus-web" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1015;
        color: #959eb0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #arus_canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 15px;
        pointer-events: none;
      }
      #loading b {
        color: #f03e74;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas id="arus_canvas"></canvas>
    <div id="loading"><b>arus</b><span>Loading…</span></div>
  </body>
</html>
