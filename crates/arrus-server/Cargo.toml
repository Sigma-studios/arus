[package]
name = "arrus-server"
description = "arus backend: accounts, teams, choreography storage, serves the web client"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "arrus-server"
path = "src/main.rs"

[dependencies]
arrus-core.workspace = true
arrus-api.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
http-body-util = "0.1.3"
tower-http = { version = "0.6", features = ["trace"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = "8.13"
mime_guess = "2.0.5"
# rustls + ring + bundled webpki roots: no OpenSSL, no system CA store needed.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1.29", features = ["v4"] }
rand = "0.10"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
